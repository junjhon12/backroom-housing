<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A wallpaper corridor on Level 0 receding toward a single dark doorway">
  <defs>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2eac2"/>
      <stop offset="1" stop-color="#e3d8a4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7d7660"/>
      <stop offset="1" stop-color="#575243"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="78%">
      <stop offset="0.45" stop-color="#14140f" stop-opacity="0"/>
      <stop offset="1" stop-color="#14140f" stop-opacity="0.4"/>
    </radialGradient>
    <clipPath id="floorClip">
      <polygon points="0,700 1600,700 960,450 640,450"/>
    </clipPath>
  </defs>

  <!-- ceiling -->
  <polygon points="0,0 1600,0 960,250 640,250" fill="url(#ceiling)"/>

  <!-- floor -->
  <polygon points="0,700 1600,700 960,450 640,450" fill="url(#floor)"/>

  <!-- carpet seams, clipped to the floor plane -->
  <g clip-path="url(#floorClip)" stroke="#4c4839" stroke-width="2" opacity="0.35">
    <line x1="800" y1="350" x2="-200" y2="900"/>
    <line x1="800" y1="350" x2="100" y2="900"/>
    <line x1="800" y1="350" x2="350" y2="900"/>
    <line x1="800" y1="350" x2="600" y2="900"/>
    <line x1="800" y1="350" x2="1000" y2="900"/>
    <line x1="800" y1="350" x2="1250" y2="900"/>
    <line x1="800" y1="350" x2="1500" y2="900"/>
    <line x1="800" y1="350" x2="1800" y2="900"/>
    <line x1="0" y1="482" x2="1600" y2="482"/>
    <line x1="0" y1="524" x2="1600" y2="524"/>
    <line x1="0" y1="582" x2="1600" y2="582"/>
    <line x1="0" y1="650" x2="1600" y2="650"/>
  </g>

  <!-- left wall -->
  <polygon points="0,0 640,250 640,450 0,700" fill="#d9cc92"/>
  <!-- right wall -->
  <polygon points="1600,0 960,250 960,450 1600,700" fill="#d1c388"/>

  <!-- wall panel seams -->
  <g stroke="#b9ab74" stroke-width="3" opacity="0.85">
    <line x1="120" y1="46.9" x2="120" y2="653.1"/>
    <line x1="240" y1="93.8" x2="240" y2="606.2"/>
    <line x1="360" y1="140.6" x2="360" y2="559.4"/>
    <line x1="480" y1="187.5" x2="480" y2="512.5"/>
    <line x1="560" y1="218.8" x2="560" y2="481.2"/>
    <line x1="1480" y1="46.9" x2="1480" y2="653.1"/>
    <line x1="1360" y1="93.8" x2="1360" y2="606.2"/>
    <line x1="1240" y1="140.6" x2="1240" y2="559.4"/>
    <line x1="1120" y1="187.5" x2="1120" y2="512.5"/>
    <line x1="1040" y1="218.8" x2="1040" y2="481.2"/>
  </g>

  <!-- baseboards -->
  <g stroke="#b0a26c" stroke-width="16">
    <line x1="0" y1="700" x2="640" y2="450"/>
    <line x1="1600" y1="700" x2="960" y2="450"/>
  </g>

  <!-- doors on the near walls -->
  <polygon points="80,222 200,241 200,540 80,572" fill="#2b2b21"/>
  <polygon points="86,230 194,247 194,532 86,561" fill="#1d1d16"/>
  <polygon points="1520,222 1400,241 1400,540 1520,572" fill="#2b2b21"/>
  <polygon points="1514,230 1406,247 1406,532 1514,561" fill="#1d1d16"/>

  <!-- ceiling light panels -->
  <polygon points="560,0 1040,0 920,110 680,110" fill="#fdf8dd"/>
  <polygon points="700,130 900,130 870,185 730,185" fill="#fbf6dc"/>
  <polygon points="760,205 840,205 830,235 770,235" fill="#fbf6dc" opacity="0.85"/>

  <!-- back wall -->
  <rect x="640" y="250" width="320" height="200" fill="#c9bb7f"/>

  <!-- back doorway -->
  <rect x="712" y="292" width="176" height="158" fill="#2b2b21"/>
  <rect x="722" y="302" width="156" height="148" fill="#15150f"/>
  <rect x="798" y="302" width="2" height="148" fill="#f6f0d0" opacity="0.3"/>

  <!-- exit sign, unlit -->
  <rect x="778" y="268" width="44" height="14" fill="#c4442b"/>
  <rect x="784" y="273" width="32" height="4" fill="#f4efd9" opacity="0.85"/>

  <!-- fluorescent spill on the floor -->
  <polygon points="560,700 1040,700 960,450 640,450" fill="#fdf8dd" opacity="0.07"/>

  <rect width="1600" height="700" fill="url(#vignette)"/>
</svg>
